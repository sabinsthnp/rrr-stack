services:       
  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    environment:
      PUID: 1000 # optional, your user id
      PGID: 1000 # optional, your group id
    volumes:
      - ${ARRPATH}homepage/config:/app/config
      - ${ARRPATH}homepage/icons:/app/public/icons
      - ${ARRPATH}homepage/data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro # optional, for docker integrations
    ports:
      - '3000:3000'
    env_file:
      - '.env'

  jellyseerr:
    image: fallenbagel/jellyseerr
    container_name: jellyseerr
    ports:
      - '5055:5055'   # Jellyseerr web interface
    volumes:
      - ${ARRPATH}jellyseerr/config:/app/config
    env_file:
      - '.env'
    restart: unless-stopped

  maintainerr:
    image: ghcr.io/jorenn92/maintainerr:latest
    container_name: maintainerr
    user: 1000:1000
    volumes:
      - ${ARRPATH}maintainerr/data:/opt/data
    environment:
      - TZ=Europe/Brussels
      # - DEBUG=true # Uncomment to enable debug logs
    ports:
      - '6246:6246'
    restart: unless-stopped

# ██████╗ ██████╗  ██████╗ ██╗    ██╗██╗      █████╗ ██████╗ ██████╗ 
